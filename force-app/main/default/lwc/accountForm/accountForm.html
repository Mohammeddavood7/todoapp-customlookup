<template>
    <lightning-card title="Create Account">
        <div class="slds-p-around_medium">
            <lightning-input label="Name" value={name} onchange={handleName}></lightning-input>
            <lightning-input label="Phone" value={phone} onchange={handlePhone}></lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button label="Save" onclick={handleSave}></lightning-button>
                <lightning-button label="Back" onclick={handleBack} class="slds-m-left_small"></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
