<template>
    <lightning-card title="Create Contact">
        <div class="slds-p-around_medium">
            <lightning-input label="First Name" value={firstName} onchange={handleFirstName}></lightning-input>
            <lightning-input label="Last Name" value={lastName} onchange={handleLastName}></lightning-input>
            <lightning-input label="Email" value={email} onchange={handleEmail}></lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button label="Save" onclick={handleSave}></lightning-button>
                <lightning-button label="Back" onclick={handleBack} class="slds-m-left_small"></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
