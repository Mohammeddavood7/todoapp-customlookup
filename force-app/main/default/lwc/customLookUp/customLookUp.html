<template>
    <div class="slds-form-element">
  <label class="slds-form-element__label" for="combobox-id-4" id="combobox-label-id-33">{objectApiNamefield}</label>
  <div class="slds-form-element__control">
    <div class="slds-combobox_container">
      <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
      <template lwc:if= {getSelectedRecords}>
        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right" role="none">
          <span class="slds-icon_container slds-icon-standard-account slds-combobox__input-entity-icon" title="Account">
          
            <lightning-icon icon-name={getStandardIcon}
            size="x-small">
            </lightning-icon>
            <span class="slds-assistive-text">{objectApiNamefield}</span>
          </span>
          <div role="combobox" tabindex="0" class="slds-input_faux slds-combobox__input slds-combobox__input-value" aria-labelledby="combobox-label-id-33" id="combobox-id-5-selected-value" aria-controls="listbox-id-5" aria-expanded="false" aria-haspopup="listbox">
            <span class="slds-truncate" id="combobox-value-id-20">{selectRecord.selectedRecordName}</span>
          </div>
          <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right" title="Remove selected option">
             <lightning-icon icon-name='utility:close'
            size="small" onclick= {removeSelectedValueHandler} value={selectRecord.selectedRecordId}>
            </lightning-icon>
            <span class="slds-assistive-text">Remove selected option</span>
          </button>
        </div>
      </template>
        <template lwc:else>
        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
          <input class="slds-input slds-combobox__input slds-has-focus slds-combobox__input-value" id="combobox-id-4" aria-activedescendant="option1" aria-autocomplete="list" aria-controls="listbox-id-4" aria-expanded="true" aria-haspopup="listbox" 
            role="combobox" type="text" placeholder="Search..." onkeyup={searchHandler} value = {searchingName} />
          <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
             <lightning-icon
          icon-name="utility:search"
          size="x-small"></lightning-icon>
          </span>
        </div>
        </template>
       
  


        <template lwc:if={showOperation}>
        <div id="listbox-id-4" class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox"   tabindex="0" aria-busy="false">
          <ul class="slds-listbox slds-listbox_vertical" role="presentation">
            
        <template for:each={outputData.data} for:item="out">
            <li key = {out.Id} role="presentation" class="slds-listbox__item" data-item={out.Id} onclick= {selectHandler}>
              <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
                <span class="slds-media__figure slds-listbox__option-icon">
                  <span class="slds-icon_container slds-icon-standard-account">
                    <lightning-icon icon-name={getStandardIcon} size="small">
                </lightning-icon>
                  </span>
                </span>
                <span class="slds-media__body">
                  <span class="slds-listbox__option-text slds-listbox__option-text_entity">
                    <span>
                      {objectApiNamefield} </span>
                  </span>
                  <span class="slds-listbox__option-meta slds-listbox__option-meta_entity"> <mark>{out.Name} </mark></span>
                </span>
              </div>
            </li>
        </template>
        
  
          </ul>
        </div>
        </template>

      </div>
    </div>
  </div>
</div>
</template>
